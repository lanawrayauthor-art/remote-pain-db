name: weekly-db-update

on:
  schedule:
    - cron: '0 6 * * 1'   # щопонеділка 06:00 UTC (09:00 Київ)
  workflow_dispatch:        # + кнопка ручного запуску

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download previous database (rolling release)
        run: |
          curl -sfL -o db.sqlite.gz \
            "https://github.com/${{ github.repository }}/releases/latest/download/db.sqlite.gz" \
            && gunzip -f db.sqlite.gz || echo "перший запуск — стартуємо з db.sqlite у репозиторії, якщо він є"

      - name: Run weekly delta update (stdlib only, без залежностей)
        run: python3 update.py

      - name: Prepare release assets
        run: |
          gzip -kf db.sqlite
          gzip -kf exports/comments.csv
          gzip -kf exports/posts.csv

      - name: Commit small stats back to repo
        run: |
          git config user.name "db-bot" && git config user.email "bot@users.noreply.github.com"
          git add exports/manifest.json exports/pain_theme_counts.csv exports/pain_theme_by_sub.csv exports/top_terms.csv data/state.json data/cursor_*.json || true
          git commit -m "weekly stats $(date -u +%F)" || echo "без змін"
          git push || true

      - name: Publish data to rolling 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Pain DB — latest weekly build"
          make_latest: true
          files: |
            db.sqlite.gz
            exports/posts.csv.gz
            exports/comments.csv.gz
            exports/pain_posts.csv
            exports/pain_comments.csv
            exports/pain_theme_counts.csv
            exports/pain_theme_by_sub.csv
            exports/top_terms.csv
            exports/manifest.json
            DATA_GUIDE_FOR_AI.md
